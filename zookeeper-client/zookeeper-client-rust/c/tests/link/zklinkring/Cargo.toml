# Standalone Rust `staticlib` for symbol-isolation verification in TLS-enabled.
# builds Bundles independent instances of `std`, `rustls`, and `ring` outside the
# main Rust client workspace, with dependency versions pinned in `Cargo.lock` for
# `--locked --offline` builds.

[package]
name = "zklinkring"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
ring = { version = "0.17.14", default-features = false }
rustls = { version = "0.23.31", default-features = false, features = ["std", "ring", "tls12"] }

[profile.release]
panic = "abort"
opt-level = 1

[workspace]
